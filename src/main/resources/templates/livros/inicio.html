<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livros</title>
    <style>
        body { font-family: sans-serif; margin: 30px; }
        nav a { margin-right: 15px; color: #e07a5f; text-decoration: none; font-weight: bold; }
        input { padding: 5px; margin: 0 10px 10px 0; }
        button { background: #e07a5f; color: white; border: none; padding: 6px 12px; cursor: pointer; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f7dfd4; }
    </style>
</head>
<body>
<nav>
    <a th:href="@{/livros}">Livros</a>
    <a th:href="@{/autores}">Autores</a>
    <a th:href="@{/categorias}">Categorias</a>
    <a th:href="@{/usuarios}">Usuários</a>
    <a th:href="@{/emprestimos}">Empréstimos</a>
</nav>

<h2 th:text="${indiceEdicao != null} ? 'Editar Livro' : 'Cadastrar Livro'"></h2>

<form th:action="${indiceEdicao != null} ? @{'/livros/editar/' + ${indiceEdicao}} : @{/livros}" method="post">
    <input type="hidden" name="_method" value="PUT" th:if="${indiceEdicao != null}" />
    <input type="text" name="titulo" th:value="${livro?.titulo}" placeholder="Título" required />
    <input type="text" name="autor" th:value="${livro?.autor}" placeholder="Autor" required />
    <input type="text" name="isbn" th:value="${livro?.isbn}" placeholder="ISBN" required />
    <button type="submit" th:text="${indiceEdicao != null} ? 'Atualizar' : 'Cadastrar'"></button>
    <a th:if="${indiceEdicao != null}" th:href="@{/livros}" style="margin-left: 10px; color: #666; text-decoration: none;">Cancelar</a>
</form>

<h2>Livros</h2>
<table>
    <thead>
    <tr>
        <th>Título</th>
        <th>Autor</th>
        <th>ISBN</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(livros)}">
        <td colspan="4">Nenhum livro cadastrado.</td>
    </tr>
    <tr th:each="l, iter : ${livros}">
        <td th:text="${l.titulo}"></td>
        <td th:text="${l.autor}"></td>
        <td th:text="${l.isbn}"></td>
        <td>
            <a th:href="@{'/livros/editar/' + ${iter.index}}" style="color: #e07a5f; margin-right: 10px; text-decoration: none; font-weight: bold;">Editar</a>
            <form th:action="@{'/livros/excluir/' + ${iter.index}}" method="post" style="display:inline;">
                <input type="hidden" name="_method" value="DELETE" />
                <button type="submit" style="background:#cc5555;">Excluir</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
